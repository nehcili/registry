<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite — Chen Baby Shower</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page">
    <a class="back-link" href="../">← Back to shower</a>

    <div class="invite-card" id="invite">
      <div style="font-size:0.9rem;color:var(--muted)">You're invited to a</div>
      <div style="font-size:2rem;font-weight:700;margin-top:4px">Baby Shower 👶</div>
      <div class="heart-divider">♡ ♡ ♡</div>
      <div style="font-size:1.15rem;font-weight:700" id="inv-date">Saturday, September 12</div>
      <div style="color:var(--muted)" id="inv-time">11:30 AM – 2:30 PM</div>
      <div style="color:var(--muted)" id="inv-loc">Newark Christian Fellowship</div>
      <div style="margin:10px 0 0;color:var(--muted)">Casual lunch + cake</div>
      <div style="color:var(--muted)">Please RSVP to <span id="inv-hosts" style="color:var(--text);font-weight:700">Li &amp; Grace</span></div>
      <img class="qr" id="qr-img" src="qr.png" alt="Registry QR code">
      <div style="font-size:0.85rem;color:var(--muted)">Scan for our registry</div>
      <a id="reg-link" href="#" target="_blank" rel="noopener" style="font-size:0.78rem;color:var(--rose);word-break:break-all">Amazon baby registry</a>
    </div>

    <div class="no-print" style="text-align:center;margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-pledge" id="save-btn">💾 Save as image</button>
      <button class="btn btn-link" onclick="window.print()">🖨️ Print</button>
    </div>
  </div>

  <script src="../config.js"></script>
  <script>
    const cfg = window.SITE_CONFIG || {};
    if (cfg.eventDate) document.getElementById('inv-date').textContent = cfg.eventDate;
    if (cfg.eventTime) document.getElementById('inv-time').textContent = cfg.eventTime;
    if (cfg.locationName) document.getElementById('inv-loc').textContent = cfg.locationName;
    if (cfg.hosts) document.getElementById('inv-hosts').textContent = cfg.hosts;
    const regLink = document.getElementById('reg-link');
    if (regLink && cfg.registryUrl) regLink.href = cfg.registryUrl;

    document.getElementById('save-btn').addEventListener('click', async () => {
      try { await document.fonts.ready; } catch (e) {}
      const W = 1080, H = 1350;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d');
      // background + border
      x.fillStyle = '#FFFBF5'; x.fillRect(0, 0, W, H);
      x.strokeStyle = '#E8B4B8'; x.lineWidth = 6; x.strokeRect(40, 40, W - 80, H - 80);
      x.textAlign = 'center';
      // headline
      x.fillStyle = '#8A8A8A'; x.font = '400 40px Nunito, sans-serif';
      x.fillText("You're invited to a", W / 2, 200);
      x.fillStyle = '#3D3D3D'; x.font = '700 84px Nunito, sans-serif';
      x.fillText('Baby Shower 👶', W / 2, 310);
      x.fillStyle = '#E8B4B8'; x.font = '600 40px Nunito, sans-serif';
      x.fillText('♡ ♡ ♡', W / 2, 385);
      // details
      x.fillStyle = '#3D3D3D'; x.font = '700 46px Nunito, sans-serif';
      x.fillText(cfg.eventDate || '', W / 2, 475);
      x.fillStyle = '#8A8A8A'; x.font = '400 40px Nunito, sans-serif';
      x.fillText(cfg.eventTime || '', W / 2, 535);
      x.fillText(cfg.locationName || '', W / 2, 590);
      x.fillText('Casual lunch + cake · RSVP to ' + (cfg.hosts || ''), W / 2, 640);
      // QR
      const qr = document.getElementById('qr-img');
      x.drawImage(qr, W / 2 - 200, 705, 400, 400);
      x.fillStyle = '#3D3D3D'; x.font = '700 38px Nunito, sans-serif';
      x.fillText('Scan for our registry', W / 2, 1150);
      x.fillStyle = '#8A8A8A'; x.font = '400 28px Nunito, sans-serif';
      x.fillText((cfg.registryUrl || '').replace('https://', ''), W / 2, 1200);
      // download
      const a = document.createElement('a');
      a.download = 'baby-shower-invite.png';
      a.href = c.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
